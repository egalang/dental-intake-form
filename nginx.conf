server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving at request time (via the variable below)
    # lets nginx start even if the upstream is temporarily unresolvable.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $registration_api https://dental-registration.angonorizal.net;

    # Reverse-proxy the public registration API so the browser makes same-origin
    # requests and CORS is not required on the API.
    location /api/ {
        proxy_pass $registration_api;
        proxy_http_version 1.1;
        proxy_set_header Host dental-registration.angonorizal.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
